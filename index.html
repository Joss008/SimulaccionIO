<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador de Transporte</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --accent:#4f46e5; --accent-dark:#4338ca; --accent-soft:#eef2ff;
  --plant:#10b981; --plant-bg:#ecfdf5; --plant-dark:#047857;
  --dest:#3b82f6; --dest-bg:#eff6ff; --dest-dark:#1d4ed8;
  --hub:#f59e0b; --hub-bg:#fffbeb; --hub-dark:#b45309;
  --good:#10b981; --warn:#f59e0b; --bad:#ef4444;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.06);
  --shadow-lg:0 8px 30px rgba(15,23,42,.14);
  --radius:12px;
  --topbar-h:56px;
  --palette-w:72px;
  --side-w:348px;
  --res-h:310px;
  font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-size:14px;
  height:100vh;height:100dvh;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent}

/* ===== Top bar ===== */
.topbar{height:var(--topbar-h);background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));
  position:relative;z-index:30;user-select:none;-webkit-user-select:none}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{width:32px;height:32px;border-radius:9px;background:var(--accent);
  display:grid;place-items:center;flex:none}
.brand-icon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2}
.brand h1{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.brand-sub{font-size:11px;color:var(--muted);white-space:nowrap}
.top-actions{display:flex;gap:8px;align-items:center}
#btnMenu{display:none}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);
  font:inherit;font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;
  touch-action:manipulation;white-space:nowrap}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.35)}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.primary svg{width:14px;height:14px;fill:#fff}
.btn.primary.running{opacity:.7;pointer-events:none}
.btn.danger{color:var(--bad);border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}

/* ===== Workspace ===== */
.workspace{display:flex;height:calc(100% - var(--topbar-h));position:relative}
.palette{width:var(--palette-w);background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;z-index:20;
  padding-left:env(safe-area-inset-left);user-select:none;-webkit-user-select:none}
.tool{width:56px;height:52px;border:1px solid transparent;background:transparent;border-radius:10px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:9px;font-weight:600;transition:.15s;font-family:inherit;
  touch-action:manipulation;flex:none}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:#f1f5f9;color:var(--text)}
.tool.active{background:var(--accent-soft);color:var(--accent);border-color:#c7d2fe}
.tool.plant.active,.tool.plant:hover{background:var(--plant-bg);color:var(--plant-dark);border-color:#a7f3d0}
.tool.dest.active,.tool.dest:hover{background:var(--dest-bg);color:var(--dest-dark);border-color:#bfdbfe}
.tool.hub.active,.tool.hub:hover{background:var(--hub-bg);color:var(--hub-dark);border-color:#fde68a}
.palette .sep{width:36px;height:1px;background:var(--border);margin:4px 0}

/* ===== Canvas ===== */
.canvas-area{flex:1;position:relative;overflow:hidden;
  background-color:#f8fafc;
  background-image:radial-gradient(#cbd5e1 1.2px,transparent 1.2px);
  background-size:24px 24px;cursor:grab;
  touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
.canvas-area.panning{cursor:grabbing}
.canvas-area.tool-connect{cursor:crosshair}
.canvas-area.tool-delete{cursor:not-allowed}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoom-controls{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:6px;z-index:10}
.zoom-controls button{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel);box-shadow:var(--shadow);cursor:pointer;font-size:15px;font-weight:700;
  color:var(--muted);display:grid;place-items:center;font-family:inherit;touch-action:manipulation}
.zoom-controls button:hover{color:var(--text);background:#f8fafc}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);
  background:rgba(15,23,42,.82);color:#fff;font-size:12px;padding:7px 14px;border-radius:99px;
  pointer-events:none;transition:opacity .4s;z-index:10;white-space:nowrap;backdrop-filter:blur(4px)}
.hint.hidden{opacity:0}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%) translateY(-8px);
  background:#fff;border:1px solid var(--border);border-left:4px solid var(--accent);
  padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:.25s;z-index:26;max-width:440px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{border-left-color:var(--bad);color:#991b1b}
.toast.warn{border-left-color:var(--warn);color:#92400e}
.toast.ok{border-left-color:var(--good);color:#065f46}

/* ===== Nodes & edges (SVG) ===== */
.node{cursor:grab}
.node.dragging{cursor:grabbing}
.node .n-bg{stroke-width:1.5;transition:filter .15s}
.node:hover .n-bg{filter:brightness(.985)}
.node.selected .n-bg{stroke-width:2.5;stroke:var(--accent)!important}
.node .n-name{font-size:13px;font-weight:700;fill:var(--text)}
.node .n-sub{font-size:11px;fill:var(--muted)}
.node .n-sub.ok{fill:#047857;font-weight:700}
.node .n-sub.warn{fill:#b45309;font-weight:700}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.edge .alloc-in{animation:fadein .45s backwards}
.node .n-ico{stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.node .n-check{font-size:10px;font-weight:700}
.edge{cursor:pointer}
.edge .e-line{fill:none;stroke:#94a3b8;stroke-width:2;transition:stroke .15s,stroke-width .15s}
.edge:hover .e-line{stroke:#64748b;stroke-width:2.6}
.edge.selected .e-line{stroke:var(--accent);stroke-width:3}
.edge.dim .e-line{opacity:.35}
.edge .e-pill{fill:#fff;stroke:var(--border);stroke-width:1}
.edge.selected .e-pill{stroke:var(--accent)}
.edge .e-cost{font-size:11px;font-weight:700;fill:#334155;text-anchor:middle;dominant-baseline:central}
.edge .e-alloc{font-size:11px;font-weight:800;fill:#065f46;text-anchor:middle;dominant-baseline:central}
.edge .e-alloc-bg{fill:#d1fae5;stroke:#6ee7b7;stroke-width:1}
.edge.active .e-line{stroke:var(--good);stroke-width:3;stroke-dasharray:11 7;animation:flowdash .55s linear infinite}
@keyframes flowdash{to{stroke-dashoffset:-18}}
.edge.dimmed{opacity:.3}
.edge.hubleg .e-line{stroke:#d97706;stroke-dasharray:5 4}
.edge.hubleg.active .e-line{stroke:var(--good);stroke-dasharray:11 7;animation:flowdash .55s linear infinite}
.connect-src .n-bg{stroke:var(--accent)!important;stroke-width:2.5!important;stroke-dasharray:6 4}
.connect-preview{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:6 4;fill:none;pointer-events:none}

/* ===== Side panel ===== */
.side{width:var(--side-w);background:var(--panel);border-left:1px solid var(--border);
  overflow-y:auto;z-index:20;flex:none;position:relative}
/* Sheet y menú: solo visibles en móvil (display:contents en escritorio) */
.sheet,.sheet-host{display:contents}
.sheet-chrome{display:none}
.menu-backdrop,.menu-card{display:none}
.side-head{padding:12px 16px 10px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;background:var(--panel);z-index:2}
.side-head h2{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.side-body{padding:14px 16px 24px}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;letter-spacing:.3px}
.badge.plant{background:var(--plant-bg);color:var(--plant-dark)}
.badge.dest{background:var(--dest-bg);color:var(--dest-dark)}
.badge.hub{background:var(--hub-bg);color:var(--hub-dark)}
.inspector-card{border:1px solid #c7d2fe;background:#f8faff;border-radius:12px;padding:12px 13px;margin-bottom:14px;box-shadow:0 2px 8px rgba(79,70,229,.06)}
.inspector-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.inspector-head .i-title{font-size:12px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:6px}
.inspector-close{border:none;background:#e2e8f0;color:#475569;width:22px;height:22px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;display:grid;place-items:center}
.inspector-close:hover{background:#cbd5e1;color:var(--text)}
.field{margin-bottom:10px}
.field label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:4px;letter-spacing:.3px}
.field input,.field select{width:100%;border:1px solid var(--border);border-radius:8px;
  padding:7px 10px;font:inherit;font-size:13.5px;background:#fff;color:var(--text);transition:.15s}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .row{display:flex;gap:8px}
.field .row .field{flex:1;margin-bottom:0}
.side-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.side-actions .btn{flex:1;justify-content:center;padding:6px 10px;font-size:12px}
.muted-note{font-size:12px;color:var(--muted);line-height:1.5;background:#f8fafc;
  border:1px dashed var(--border);border-radius:10px;padding:10px 12px}
.empty-state{text-align:center;padding:24px 10px;color:var(--muted)}
.empty-state svg{width:40px;height:40px;stroke:#cbd5e1;fill:none;stroke-width:1.5;margin-bottom:8px}
.empty-state p{font-size:13px;line-height:1.55}

/* ===== Data matrix ===== */
.matrix-toolbar{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.matrix-toolbar .mt-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.matrix-toolbar .mt-btns{display:flex;gap:4px}
.mini-btn{border:1px solid var(--border);background:#f8fafc;color:#475569;font:inherit;font-size:11px;font-weight:700;
  padding:4px 8px;border-radius:6px;cursor:pointer;transition:.15s}
.mini-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.mini-btn.danger:hover{border-color:var(--bad);color:var(--bad);background:#fef2f2}
.matrix-wrap{overflow-x:auto;margin:0 -4px}
table.matrix{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.matrix th,table.matrix td{padding:4px 3px;text-align:center;vertical-align:middle}
table.matrix th{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
table.matrix th.rh{text-align:left;padding-left:2px}
table.matrix td input{width:48px;text-align:center;border:1px solid var(--border);border-radius:7px;
  padding:5px 3px;font:inherit;font-size:13px;font-weight:600;background:#fff;color:var(--text)}
table.matrix td input:hover{border-color:#94a3b8}
table.matrix td input:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
table.matrix td input.fixed{background:#f1f5f9;font-weight:700;color:#334155;border-color:transparent}
table.matrix td input.fixed:hover{border-color:var(--border);background:#fff}
table.matrix .row-label{font-weight:800;font-size:12px;text-align:left;padding-left:2px;white-space:nowrap}
table.matrix .row-label small{display:block;font-weight:600;color:var(--muted);font-size:10px}
table.matrix td.blocked button{width:48px;border:1px dashed #cbd5e1;background:#f8fafc;color:#64748b;
  border-radius:7px;padding:5px 2px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;line-height:1.15}
table.matrix td.blocked button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
table.matrix td.blocked .via-hint{display:block;font-size:9.5px;color:var(--hub-dark);font-weight:700;margin-top:2px;white-space:nowrap}
table.matrix tfoot td{font-size:11px;font-weight:800;color:var(--muted);padding-top:8px}
table.matrix tfoot td.bal-ok{color:var(--good)}
table.matrix tfoot td.bal-bad{color:var(--bad)}
table.matrix .tot{font-weight:800;font-size:12px;color:#334155}
table.matrix .cell-box{position:relative;display:inline-flex;flex-direction:column;align-items:center}
table.matrix .cell-box .x{position:absolute;top:-5px;right:-5px;width:15px;height:15px;border-radius:99px;
  background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;font-size:10px;font-weight:800;cursor:pointer;
  opacity:0;transition:.15s;line-height:13px;text-align:center;padding:0;z-index:2}
table.matrix td:hover .cell-box .x{opacity:1}
table.matrix .cell-box .x:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
table.matrix .cell-box .via-tag{font-size:9px;color:var(--hub-dark);background:var(--hub-bg);border:1px solid #fde68a;
  border-radius:4px;padding:0 4px;margin-top:2px;font-weight:700;white-space:nowrap}
.hub-section{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.hub-section h4{font-size:11px;font-weight:800;color:var(--hub-dark);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.hub-sub{font-size:10.5px;font-weight:700;color:var(--muted);margin:8px 0 4px}
.mtx-legend{display:flex;gap:12px;margin-top:10px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
.mtx-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* ===== Results ===== */
.results{position:absolute;left:var(--palette-w);right:var(--side-w);bottom:0;height:0;overflow:hidden;
  background:var(--panel);border-top:1px solid var(--border);box-shadow:0 -8px 30px rgba(15,23,42,.1);
  transition:height .3s cubic-bezier(.4,0,.2,1);z-index:25;display:flex;flex-direction:column}
.results.open{height:var(--res-h)}
.results.open.minimized{height:42px}
.results-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;
  background:#f8fafc;border-bottom:1px solid var(--border);flex:none;min-height:42px}
.results-bar .rb-left{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.results-bar .rb-live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#047857;
  background:#ecfdf5;border:1px solid #a7f3d0;padding:2px 8px;border-radius:99px}
.results-bar .rb-live i{width:7px;height:7px;border-radius:99px;background:#10b981;display:inline-block}
.results-bar .rb-sum{font-size:12px;font-weight:800;color:var(--text)}
.results-bar .rb-actions{display:flex;align-items:center;gap:6px}
.results-btn{border:1px solid var(--border);background:#fff;height:26px;padding:0 9px;border-radius:7px;
  cursor:pointer;color:var(--muted);font:inherit;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.results-btn:hover{background:#e2e8f0;color:var(--text)}
.results-inner{flex:1;overflow-y:auto;padding:14px 20px calc(20px + env(safe-area-inset-bottom))}
.results h3{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.kpi{border:1px solid var(--border);border-radius:12px;padding:11px 14px;background:#fff;transition:.2s}
.kpi .k-label{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.3px;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.kpi .k-value{font-size:25px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:11px;color:var(--muted);margin-top:2px}
.kpi.best{background:linear-gradient(135deg,#ecfdf5,#f0fdfa);border-color:#a7f3d0}
.kpi.best .k-value{color:#047857}
.kpi.best .k-label{color:#047857}
.kpi.save{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border-color:#c7d2fe}
.kpi.save .k-value{color:var(--accent)}
.kpi.na .k-value{color:#cbd5e1;font-size:18px}
.res-cols{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
.bars{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bar-row{display:grid;grid-template-columns:130px 1fr 64px;gap:10px;align-items:center;font-size:12px}
.bar-row .b-name{font-weight:700;color:#334155}
.bar-track{height:18px;background:#f1f5f9;border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1);
  background:linear-gradient(90deg,#818cf8,#6366f1);display:flex;align-items:center;justify-content:flex-end;
  padding-right:6px;color:#fff;font-size:9.5px;font-weight:800;min-width:0}
.bar-fill.good{background:linear-gradient(90deg,#34d399,#059669)}
.bar-row .b-val{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 12px;
  font:inherit;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s;
  touch-action:manipulation}
.tab:hover{border-color:#cbd5e1;color:var(--text)}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
table.alloc{border-collapse:collapse;width:100%;font-size:13px}
table.alloc th,table.alloc td{border:1px solid var(--border);padding:6px 9px;text-align:center}
table.alloc th{background:#f8fafc;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.3px}
table.alloc td.name{font-weight:800;background:#f8fafc;font-size:12px;text-align:left}
table.alloc td.v{font-variant-numeric:tabular-nums;font-weight:600}
table.alloc td.v.pos{background:#ecfdf5;color:#065f46;font-weight:800}
table.alloc tr.sum td{background:#f1f5f9;font-weight:800;font-size:12px}
table.alloc td.dummy{opacity:.55;font-style:italic}
.hub-card{border:1px solid #fde68a;background:var(--hub-bg);border-radius:11px;padding:11px 13px;margin-top:12px}
.hub-card h4{font-size:11px;font-weight:800;color:var(--hub-dark);letter-spacing:.4px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.hub-card p{font-size:12.5px;color:#92400e;font-weight:600;line-height:1.5}
.hub-card .ok{color:#047857;font-weight:800}
details.more{margin-top:12px;border:1px solid var(--border);border-radius:11px;overflow:hidden}
details.more summary{cursor:pointer;padding:9px 13px;font-size:12px;font-weight:800;color:#334155;
  background:#f8fafc;list-style:none;display:flex;align-items:center;gap:7px;user-select:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";color:var(--muted);transition:.15s;display:inline-block}
details.more[open] summary::before{transform:rotate(90deg)}
details.more .more-body{padding:11px 13px}
.log{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.75;color:#334155;max-height:150px;overflow:auto}
.log .lg-head{font-weight:800;color:var(--accent);margin-top:6px}
.log .lg-head:first-child{margin-top:0}
.log .lg-good{color:#047857;font-weight:700}
.log .lg-warn{color:#b45309}
.formula{font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.8;color:#334155;
  max-height:170px;overflow:auto;white-space:pre;user-select:text}
.formula .fx{color:var(--accent);font-weight:700}

<script>
// === SOLVER START ===
"use strict";
const EPS = 1e-9;

function sum(a){ return a.reduce((s,v)=>s+v,0); }
function cloneMatrix(x){ return x.map(r=>r.slice()); }

/* Construye la matriz de costos/capacidades del estado del lienzo.
   Soporta rutas directas (Planta→Destino) y rutas de transbordo vía 1 o más Hubs (Planta→Hub→...→Destino).
   Retorna { plants, dests, hubs, cost, cap, via, viaName, directEdge, viaBest, allPaths, warnings } */
function buildModel(state){
  const plants = state.nodes.filter(n=>n.type==='plant');
  const dests  = state.nodes.filter(n=>n.type==='dest');
  const hubs   = state.nodes.filter(n=>n.type==='hub');
  const m = plants.length, n = dests.length;
  const cost       = Array.from({length:m},()=>Array(n).fill(null));
  const cap        = Array.from({length:m},()=>Array(n).fill(null));
  const via        = Array.from({length:m},()=>Array(n).fill(null));
  const viaName    = Array.from({length:m},()=>Array(n).fill(null));
  const directEdge = Array.from({length:m},()=>Array(n).fill(null));
  const viaBest    = Array.from({length:m},()=>Array(n).fill(null));
  const allPaths   = Array.from({length:m},()=>Array.from({length:n},()=>[]));
  const warnings = [];
  const nodeMap = {};
  state.nodes.forEach(nd=>{ nodeMap[nd.id] = nd; });
  const outEdges = {};
  state.nodes.forEach(nd=>{ outEdges[nd.id] = []; });
  state.edges.forEach(e=>{ if(outEdges[e.from]) outEdges[e.from].push(e); });

  for(let i=0;i<m;i++){
    const pId = plants[i].id;
    for(let j=0;j<n;j++){
      const dId = dests[j].id;
      const paths = [];
      // DFS para encontrar todos los caminos simples de P_i a D_j (directo o vía hubs)
      function dfs(currId, visited, edgeList, hubList, totalCost, minCap){
        const edges = outEdges[currId] || [];
        for(const e of edges){
          if(e.to === dId){
            const nc = totalCost + e.cost;
            const ncap = e.capacity==null ? minCap : (minCap==null ? e.capacity : Math.min(minCap, e.capacity));
            paths.push({
              cost: Math.round(nc*1e6)/1e6,
              cap: ncap,
              edges: [...edgeList, e],
              hubs: hubList.slice(),
              viaId: hubList.length ? hubList[0].id : null,
              viaLabel: hubList.length ? hubList.map(h=>h.name).join('→') : null
            });
          } else if(nodeMap[e.to] && nodeMap[e.to].type==='hub' && !visited.has(e.to)){
            visited.add(e.to);
            const ncap = e.capacity==null ? minCap : (minCap==null ? e.capacity : Math.min(minCap, e.capacity));
            dfs(e.to, visited, [...edgeList, e], [...hubList, nodeMap[e.to]], totalCost + e.cost, ncap);
            visited.delete(e.to);
          }
        }
      }
      dfs(pId, new Set([pId]), [], [], 0, null);
      // Ordenar por menor costo; en empate, menor número de saltos
      paths.sort((a,b)=> (a.cost - b.cost) || (a.edges.length - b.edges.length));
      allPaths[i][j] = paths;
      const dir = paths.find(pt=>pt.hubs.length===0);
      if(dir) directEdge[i][j] = dir.edges[0];
      const vBest = paths.find(pt=>pt.hubs.length>0);
      if(vBest) viaBest[i][j] = vBest;
      // Elegir la mejor ruta usable (con capacidad > 0)
      const usablePaths = paths.filter(pt=>pt.cap===null || pt.cap > EPS);
      const best = usablePaths[0] || paths[0] || null;
      if(best){
        cost[i][j] = best.cost;
        // Si hay caminos paralelos, la capacidad total disponible entre P_i y D_j es la suma de capacidades
        if(usablePaths.some(pt=>pt.cap===null)) cap[i][j] = null;
        else if(usablePaths.length) cap[i][j] = usablePaths.reduce((s,pt)=>s+(pt.cap||0), 0);
        else cap[i][j] = best.cap;
        via[i][j] = best.viaId;
        viaName[i][j] = best.viaLabel;
      }
    }
  }
  if(hubs.length && m && n){
    for(const h of hubs){
      const hasIn  = state.edges.some(e=>e.to===h.id);
      const hasOut = state.edges.some(e=>e.from===h.id);
      if(!hasIn && !hasOut) warnings.push(`El hub ${h.name} no tiene rutas conectadas. Usa «Ruta» o la tabla para conectar Planta→${h.name} y ${h.name}→Destino.`);
      else if(!hasIn) warnings.push(`Al hub ${h.name} le falta al menos una ruta de entrada (Planta → ${h.name}).`);
      else if(!hasOut) warnings.push(`Al hub ${h.name} le falta al menos una ruta de salida (${h.name} → Destino).`);
    }
    const anyViaPossible = viaBest.flat().some(v=>v!==null);
    const anyViaChosen = via.flat().some(v=>v!==null);
    if(anyViaPossible && !anyViaChosen){
      warnings.push('Las rutas directas actuales tienen menor o igual costo que pasar por el hub (el solver elige automáticamente la vía más económica).');
    }
  }
  return { plants, dests, hubs, cost, cap, via, viaName, directEdge, viaBest, allPaths, warnings };
}

/* Ajusta oferta/demanda desbalanceada con nodos ficticios (costo 0). */
function prepareProblem(model){
  const supply = model.plants.map(p=>p.supply);
  const demand = model.dests.map(d=>d.demand);
  const m0 = supply.length, n0 = demand.length;
  let cost = model.cost.map(r=>r.slice());
  let cap  = model.cap.map(r=>r.slice());
  const notes = [];
  let dummyRow = -1, dummyCol = -1;
  const S = sum(supply), D = sum(demand);
  if(S < D){
    dummyRow = supply.length;
    supply.push(D-S);
    cost.push(Array(n0).fill(0));
    cap.push(Array(n0).fill(null));
    notes.push('La demanda ('+D+') supera la oferta ('+S+'): se agregó una planta ficticia con '+ (D-S) +' unidades.');
  } else if(D < S){
    dummyCol = demand.length;
    demand.push(S-D);
    for(let i=0;i<supply.length;i++){ cost[i].push(0); cap[i].push(null); }
    notes.push('La oferta ('+S+') supera la demanda ('+D+'): se agregó un destino ficticio que absorbe '+ (S-D) +' unidades.');
  }
  return { cost, cap, supply, demand, dummyRow, dummyCol, notes, m:supply.length, n:demand.length, m0, n0, S, D };
}

/* Flujo máximo en la red (source→plantas→destinos→sink) con rutas bloqueadas y capacidades.
   inRows/inCols: índices de filas/columnas a considerar (permite excluir nodos ficticios).
   Retorna { flow, arcs } con arcs[m x n] = flujo por celda. */
function maxFlowArcs(cost, cap, supply, demand, inRows, inCols){
  const m = supply.length, n = demand.length;
  const rows = inRows || supply.map((_,i)=>i);
  const cols = inCols || demand.map((_,j)=>j);
  const S = 0, T = 1 + rows.length + cols.length, N = T + 1;
  const C = Array.from({length:N},()=>Array(N).fill(0));
  const rPos = {}, cPos = {};
  rows.forEach((r,k)=>rPos[r]=1+k);
  cols.forEach((c,k)=>cPos[c]=1+rows.length+k);
  rows.forEach(r=>{ C[S][rPos[r]] = supply[r]; });
  cols.forEach(c=>{ C[cPos[c]][T] = demand[c]; });
  const init = Array.from({length:m},()=>Array(n).fill(0));
  rows.forEach(r=>cols.forEach(c=>{
    if(!usable(cost,cap,r,c)) return;
    const rc = cap[r][c]==null ? Math.min(supply[r], demand[c]) : cap[r][c];
    init[r][c] = Math.max(0, Math.min(rc, supply[r], demand[c]));
    C[rPos[r]][cPos[c]] = init[r][c];
  }));
  let flow = 0, iters = 0;
  const capT = sum(cols.map(c=>demand[c]));
  while(flow < capT - EPS && iters++ < 800){
    const prev = Array(N).fill(-1);
    const q = [S]; prev[S] = S;
    let head = 0;
    while(head < q.length){
      const u = q[head++];
      if(u===T) break;
      for(let v=1;v<N;v++) if(prev[v]===-1 && C[u][v] > EPS){ prev[v]=u; q.push(v); }
    }
    if(prev[T]===-1) break;
    let aug = Infinity, v = T;
    while(v!==S){ const u=prev[v]; aug = Math.min(aug, C[u][v]); v=u; }
    v = T;
    while(v!==S){ const u=prev[v]; C[u][v]-=aug; C[v][u]+=aug; v=u; }
    flow += aug;
  }
  const arcs = Array.from({length:m},()=>Array(n).fill(0));
  rows.forEach(r=>cols.forEach(c=>{
    const used = init[r][c] - C[rPos[r]][cPos[c]];
    if(used > EPS) arcs[r][c] = used;
  }));
  return { flow, arcs };
}

/* Factibilidad: ¿se puede transportar min(oferta, demanda) con las rutas disponibles?
   Excluye los nodos ficticios del chequeo. */
function checkFeasibility(prob){
  const { cost, cap, supply, demand, m0, n0 } = prob;
  const rows = [], cols = [];
  for(let i=0;i<supply.length;i++) if(prob.dummyRow !== i && i < m0) rows.push(i);
  for(let j=0;j<demand.length;j++) if(prob.dummyCol !== j && j < n0) cols.push(j);
  const S = sum(rows.map(i=>supply[i])), D = sum(cols.map(j=>demand[j]));
  const required = Math.min(S, D);
  if(required <= EPS) return { ok:true, short:[] };
  const { flow, arcs } = maxFlowArcs(cost, cap, supply, demand, rows, cols);
  if(flow + 1e-6 < required){
    const short = [];
    cols.forEach(j=>{
      let got = 0; rows.forEach(i=>got += arcs[i][j]);
      if(got + 1e-6 < demand[j]) short.push(j);
    });
    return { ok:false, flow, required, shortIdx: short };
  }
  return { ok:true, flow, required, shortIdx: [] };
}

/* Solución inicial factible directa del flujo (respaldo cuando los métodos clásicos no aplican). */
function seedFromFlow(prob){
  const { cost, cap, supply, demand } = prob;
  const { flow, arcs } = maxFlowArcs(cost, cap, supply, demand);
  const need = sum(supply);
  if(flow + 1e-6 < need) return null;
  return arcs;
}

/* ---------- Métodos de solución ---------- */

function totalCost(x, cost){
  let z = 0;
  for(let i=0;i<x.length;i++) for(let j=0;j<x[i].length;j++)
    if(x[i][j] > EPS && cost[i][j] !== null) z += x[i][j]*cost[i][j];
  return Math.round(z*1e6)/1e6;
}

function usable(cost, cap, i, j){
  return cost[i][j] !== null && !(cap[i][j] !== null && cap[i][j] <= EPS);
}

/* Esquina noroeste clásica; salta rutas bloqueadas y respeta capacidades.
   Regla de avance: dentro de una fila j solo avanza; al cambiar de fila j vuelve a la
   primera columna con demanda pendiente (así se revisan columnas abandonadas). */
function northwest(prob){
  const { cost, cap, supply, demand, m, n } = prob;
  const x = Array.from({length:m},()=>Array(n).fill(0));
  const s = supply.slice(), d = demand.slice();
  const steps = [];
  let i = 0, guard = 0;
  while(i < m && guard++ < 20000){
    if(s[i] <= EPS){ i++; continue; }
    // primera columna: con demanda pendiente, ruta usable y capacidad disponible
    let j = 0;
    while(j < n && (d[j] <= EPS || !usable(cost,cap,i,j) ||
          (cap[i][j] !== null && x[i][j] >= cap[i][j] - EPS))) j++;
    if(j >= n) break; // fila con oferta y sin celda disponible
    const avail = cap[i][j] === null ? Infinity : cap[i][j] - x[i][j];
    const q = Math.min(s[i], d[j], avail);
    if(q <= EPS){ i++; continue; }
    const beforeS = s[i], beforeD = d[j];
    x[i][j] += q; s[i] -= q; d[j] -= q;
    steps.push('Asignar x'+sub(i+1)+sub(j+1)+' = '+fmtN(q)+'   ('+fmtN(beforeS)+' → '+fmtN(s[i])+' de oferta · '+fmtN(beforeD)+' → '+fmtN(d[j])+' de demanda)');
  }
  if(sum(s) > 1e-6 || sum(d) > 1e-6) return { error:'La esquina noroeste no puede cubrir oferta y demanda con las rutas y capacidades actuales.' };
  return { x, steps };
}

/* Costo mínimo: asigna primero a la ruta más barata. */
function leastCost(prob){
  const { cost, cap, supply, demand, m, n } = prob;
  const x = Array.from({length:m},()=>Array(n).fill(0));
  const s = supply.slice(), d = demand.slice();
  const steps = [];
  const done = Array.from({length:m},()=>Array(n).fill(false));
  for(let iter=0; iter<m*n+5; iter++){
    if(sum(s) <= EPS && sum(d) <= EPS) break;
    let bi=-1, bj=-1, bc=Infinity;
    for(let i=0;i<m;i++){ if(s[i]<=EPS) continue;
      for(let j=0;j<n;j++){ if(d[j]<=EPS || done[i][j]) continue;
        if(!usable(cost,cap,i,j)) continue;
        if(cost[i][j] < bc - EPS || (Math.abs(cost[i][j]-bc)<=EPS && (bi<0 || i<bi || (i===bi && j<bj)))){
          bc = cost[i][j]; bi=i; bj=j;
        }
      }
    }
    if(bi<0) return { error:'No se pudo construir una solución inicial con costo mínimo: revisa que las rutas permitan cubrir toda la oferta y la demanda.' };
    let q = Math.min(s[bi], d[bj]);
    if(cap[bi][bj] !== null) q = Math.min(q, cap[bi][bj]);
    if(q <= EPS){ done[bi][bj]=true; continue; }
    x[bi][bj]=q; s[bi]-=q; d[bj]-=q;
    steps.push('Ruta más barata (costo '+fmtN(bc)+'): x'+sub(bi+1)+sub(bj+1)+' = '+fmtN(q));
    if(cap[bi][bj] !== null && x[bi][bj] >= cap[bi][bj]-EPS) done[bi][bj]=true;
  }
  if(sum(s) > EPS || sum(d) > EPS) return { error:'La asignación por costo mínimo quedó incompleta: ajusta las rutas de la red.' };
  return { x, steps };
}

/* Completa una base (bosque) agregando celdas usables no básicas hasta conectar
   todas las filas/columnas con rutas usables. No debe reconstruirse desde x>0:
   las celdas en cota superior (x>0 pero fuera de la base) se quedan fuera. */
function completeBasis(basisIn, cost, cap, m, n){
  const basis = basisIn.map(r=>r.slice());
  const dsu = size => {
    const p = Array.from({length:size},(_,k)=>k);
    const f = a => { while(p[a]!==a){ p[a]=p[p[a]]; a=p[a]; } return a; };
    return { f, u:(a,b)=>{ a=f(a); b=f(b); if(a!==b){ p[b]=a; return true; } return false; } };
  };
  const dBasic = dsu(m+n);
  for(let i=0;i<m;i++) for(let j=0;j<n;j++) if(basis[i][j]) dBasic.u(i, m+j);
  // agrega celdas usables no básicas que unan componentes distintas (sin crear ciclos)
  let changed = true;
  while(changed){
    changed = false;
    for(let i=0;i<m && !changed;i++) for(let j=0;j<n && !changed;j++){
      if(basis[i][j] || !usable(cost,cap,i,j)) continue;
      if(dBasic.f(i) !== dBasic.f(m+j)){ basis[i][j] = true; dBasic.u(i, m+j); changed = true; }
    }
  }
  return basis;
}

/* Si las x>0 forman ciclos (posible con capacidades), deshace ciclos desplazando flujo
   alrededor del ciclo hasta que una celda llegue a una cota y salga de la base. */
function shrinkBasis(x, cost, cap, basis, m, n){
  for(let guard=0; guard<100; guard++){
    // detecta ciclo incrementalmente
    const p = Array.from({length:m+n},(_,k)=>k);
    const f = a => { while(p[a]!==a){ p[a]=p[p[a]]; a=p[a]; } return a; };
    let cycleCell = null;
    outer:
    for(let i=0;i<m;i++) for(let j=0;j<n;j++){
      if(!basis[i][j]) continue;
      const a = f(i), b = f(m+j);
      if(a === b){ cycleCell = [i,j]; break outer; }
      p[b] = a;
    }
    if(!cycleCell) return;
    // construye el ciclo que pasa por cycleCell
    const cyc = cycleInBasis(basis, cycleCell[0], cycleCell[1], m, n);
    if(!cyc){ basis[cycleCell[0]][cycleCell[1]] = false; continue; }
    const cells = [{i:cycleCell[0], j:cycleCell[1], enter:true}];
    for(const [ri,rj] of cyc) cells.push({i:ri, j:rj, enter:false});
    let sgn = -1; // la entrante disminuye
    for(const c of cells){ c.s = sgn; sgn = -sgn; }
    // θ: hasta que alguien llegue a una cota
    let theta = Infinity, hitter = null;
    for(const c of cells){
      const capij = cap[c.i][c.j]==null ? Infinity : cap[c.i][c.j];
      const lim = c.s > 0 ? capij - x[c.i][c.j] : x[c.i][c.j];
      if(lim < theta){ theta = lim; hitter = c; }
    }
    if(hitter === null || !isFinite(theta)){ basis[cycleCell[0]][cycleCell[1]] = false; continue; }
    theta = Math.max(0, theta);
    for(const c of cells){ x[c.i][c.j] = Math.max(0, x[c.i][c.j] + c.s*theta); }
    basis[hitter.i][hitter.j] = false; // sale de la base al llegar a su cota
    if(x[hitter.i][hitter.j] <= EPS) x[hitter.i][hitter.j] = 0;
  }
}

/* Ciclo en la base que incluye la celda (ei,ej) — como findCycle pero con la celda ya en la base. */
function cycleInBasis(basis, ei, ej, m, n){
  const b2 = basis.map(r=>r.slice());
  b2[ei][ej] = false; // quita la celda para buscar el camino de vuelta
  const prev = new Array(m+n).fill(null);
  const start = ei, target = m + ej;
  const q = [start]; prev[start] = {from:-1, cell:null};
  let head = 0, found = false;
  while(head < q.length){
    const node = q[head++];
    if(node === target){ found = true; break; }
    if(node < m){
      const row = node;
      for(let j=0;j<n;j++){
        if(!b2[row][j]) continue;
        const col = m+j;
        if(prev[col]===null){ prev[col] = {from:node, cell:[row,j]}; q.push(col); }
      }
    } else {
      const col = node - m;
      for(let i=0;i<m;i++){
        if(!b2[i][col]) continue;
        if(prev[i]===null){ prev[i] = {from:node, cell:[i,col]}; q.push(i); }
      }
    }
  }
  if(!found) return null;
  const cells = [];
  let node = target;
  while(node !== start){
    const p = prev[node];
    if(!p || p.cell===null) return null;
    cells.push(p.cell);
    node = p.from;
  }
  return cells;
}

/* u-v (MODI) con celdas bloqueadas, degeneración y capacidad (cota superior). */
function modi(prob, x0, opts){
  opts = opts || {};
  const { cost, cap, supply, demand, m, n } = prob;
  let x = cloneMatrix(x0);
  // bases con ciclos (posibles si hay capacidades) se reducen; luego se completan los conectores
  let basis = Array.from({length:m},(_,i)=>Array.from({length:n},(_,j)=> x[i][j] > EPS));
  shrinkBasis(x, cost, cap, basis, m, n);
  basis = completeBasis(basis, cost, cap, m, n);
  const steps = [];
  const blocked = {};
  let z = totalCost(x, cost);
  const startZ = z;
  const key = (i,j)=>i+','+j;
  const MAXIT = 500;
  let iter = 0, optimal = false, note = null;

  for(iter=0; iter<MAXIT; iter++){
    // ---- u, v por BFS sobre la base ----
    const u = Array(m).fill(null), v = Array(n).fill(null);
    for(let i=0;i<m;i++){
      if(u[i] !== null) continue;
      u[i] = 0;
      const q = [['r',i]];
      while(q.length){
        const [t,k] = q.shift();
        if(t==='r'){
          for(let j=0;j<n;j++) if(basis[k][j] && v[j]===null){ v[j] = cost[k][j] - u[k]; q.push(['c',j]); }
        } else {
          for(let r=0;r<m;r++) if(basis[r][k] && u[r]===null){ u[r] = cost[r][k] - v[k]; q.push(['r',r]); }
        }
      }
    }
    for(let i=0;i<m;i++) if(u[i]===null) u[i]=0;
    for(let j=0;j<n;j++) if(v[j]===null) v[j]=0;

    // ---- celda entrante (regla de Bland: primer índice en orden de fila) ----
    let ei=-1, ej=-1, ed=0, edir=0;
    for(let i=0;i<m && ei<0;i++) for(let j=0;j<n && ei<0;j++){
      if(!usable(cost,cap,i,j)) continue;
      if(basis[i][j]) continue;
      const k = key(i,j);
      if(blocked[k]) continue;
      const d = cost[i][j] - u[i] - v[j];
      const capij = cap[i][j]==null ? Infinity : cap[i][j];
      if(x[i][j] <= EPS && d < -EPS){ ei=i; ej=j; ed=d; edir=1; }
      else if(x[i][j] >= capij - EPS && d > EPS){ ei=i; ej=j; ed=d; edir=-1; }
    }
    if(ei < 0){
      const pending = Object.keys(blocked).length;
      optimal = pending === 0;
      if(pending) note = 'Verificación interrumpida en ' + pending + ' celda(s).';
      break;
    }

    // ---- ciclo único base + entrante ----
    const cyc = findCycle(basis, ei, ej, m, n);
    if(!cyc){ blocked[key(ei,ej)] = true; continue; }
    // ciclo: [entrante, c1, c2, ...]  signos alternos
    const cells = [{i:ei, j:ej, enter:true}];
    for(const [ri,rj] of cyc) cells.push({i:ri, j:rj, enter:false});
    let sgn = edir; // +1 aumenta, -1 disminuye
    for(const c of cells){ c.s = sgn; sgn = -sgn; }

    // ---- prueba de razón ----
    let theta = Infinity, hitter = null;
    const consider = (c, lim) => {
      if(lim < -EPS) return;
      if(lim < theta - EPS){ theta = lim; hitter = c; return; }
      if(Math.abs(lim - theta) <= EPS && hitter){
        // desempate: preferir sacar a un básico y luego el menor índice
        const hPref = hitter.enter ? 1 : 0;
        const cPref = c.enter ? 1 : 0;
        if(cPref < hPref){ hitter = c; return; }
        if(cPref === hPref && !c.enter && !hitter.enter &&
           (c.i < hitter.i || (c.i===hitter.i && c.j < hitter.j))) hitter = c;
      }
    };
    for(const c of cells){
      const capij = cap[c.i][c.j]==null ? Infinity : cap[c.i][c.j];
      const lim = c.s > 0 ? capij - x[c.i][c.j] : x[c.i][c.j];
      consider(c, lim);
    }
    if(hitter === null || !isFinite(theta)){ note = 'No se encontró dirección de mejora (degeneración).'; break; }
    theta = Math.max(0, theta);

    // ---- aplica ----
    for(const c of cells) x[c.i][c.j] += c.s * theta;
    for(const c of cells) if(x[c.i][c.j] < EPS) x[c.i][c.j] = 0;

    let leftDesc = null;
    if(hitter.enter){
      // la entrante llega a su cota sin cambiar la base (los u,v siguen igual)
      leftDesc = 'x'+sub(hitter.i+1)+sub(hitter.j+1)+' llega a su '+(hitter.s>0?'cota superior':'cota inferior')+' (no entra a la base)';
    } else {
      basis[hitter.i][hitter.j] = false;
      basis[ei][ej] = true;
      leftDesc = 'sale x'+sub(hitter.i+1)+sub(hitter.j+1);
      delete blocked[key(hitter.i,hitter.j)];
    }
    const nz = totalCost(x, cost);
    steps.push('Iter '+(iter+1)+': entra x'+sub(ei+1)+sub(ej+1)+' (d='+fmtN(ed)+'), θ='+fmtN(theta)+', '+leftDesc+'.  Z: '+fmtN(z)+' → '+fmtN(nz));
    z = nz;
  }

  if(!optimal && iter >= MAXIT) note = 'Se alcanzó el máximo de iteraciones.';
  const zFinal = totalCost(x, cost);
  return { x, cost:zFinal, steps, optimal:optimal && !note, note, iters:iter, startZ };
}

/* Encuentra el ciclo base+celda (ei,ej). Devuelve lista de celdas [ [i,j], ... ] sin la entrante. */
function findCycle(basis, ei, ej, m, n){
  const prev = new Array(m+n).fill(null); // nodo -> {from, cell}
  const start = m + ej, target = ei;
  const q = [start]; prev[start] = {from:-1, cell:null};
  let head = 0, found = false;
  while(head < q.length){
    const node = q[head++];
    if(node === target){ found = true; break; }
    if(node < m){ // nodo fila
      const row = node;
      for(let j=0;j<n;j++){
        if(!basis[row][j]) continue;
        const col = m+j;
        if(prev[col]===null){ prev[col] = {from:node, cell:[row,j]}; q.push(col); }
      }
    } else { // nodo columna
      const col = node - m;
      for(let i=0;i<m;i++){
        if(!basis[i][col]) continue;
        if(prev[i]===null){ prev[i] = {from:node, cell:[i,col]}; q.push(i); }
      }
    }
  }
  if(!found) return null;
  const cells = [];
  let node = target;
  while(node !== start){
    const p = prev[node];
    if(!p || p.cell===null) return null;
    cells.push(p.cell);
    node = p.from;
  }
  return cells;
}

/* Problema completo: factibilidad + noroeste + costo mínimo + MODI. */
function solveFull(model){
  const prob = prepareProblem(model);
  const feas = checkFeasibility(prob);
  const out = { prob, model, notes: prob.notes.slice(), warnings: model.warnings.slice(), feasible: feas.ok };
  if(!feas.ok){
    out.error = 'La red no puede cubrir toda la demanda con las rutas disponibles. Revisa rutas y capacidades.';
    out.shortIdx = feas.shortIdx;
    return out;
  }
  const nw = northwest(prob);
  const lc = leastCost(prob);
  out.nw = nw.error ? { error:nw.error } : { x:nw.x, z:totalCost(nw.x, prob.cost), steps:nw.steps };
  out.lc = lc.error ? { error:lc.error } : { x:lc.x, z:totalCost(lc.x, prob.cost), steps:lc.steps };

  // solución inicial para MODI: noroeste > costo mínimo > flujo factible
  let seed = null, seedName = null;
  if(out.nw.x){ seed = out.nw.x; seedName = 'esquina noroeste'; }
  else if(out.lc.x){ seed = out.lc.x; seedName = 'costo mínimo'; }
  else {
    const fx = seedFromFlow(prob);
    if(fx){ seed = fx; seedName = 'flujo factible';
      out.notes.push('Los métodos clásicos no pudieron armar la solución inicial; se usó un flujo factible y MODI lo optimiza.');
    }
  }
  if(seed){
    const mi = modi(prob, seed);
    out.modi = mi;
    out.modiFrom = seedName;
    out.best = { x:mi.x, z:mi.cost };
    if(out.lc.x){
      const mi2 = modi(prob, out.lc.x);
      out.modiFromLC = mi2;
      out.lcOptimal = mi2.optimal && Math.abs(mi2.cost - out.lc.z) < EPS;
    }
  } else {
    out.error = out.error || 'No hay solución inicial posible.';
  }
  return out;
}

/* Flujos por arista del lienzo a partir de la asignación (soporta rutas directas y transbordo por 1 o más hubs). */
function edgeFlows(state, model, x){
  const flows = {}; // edgeId -> unidades
  const m = model.plants.length, n = model.dests.length;
  for(let i=0;i<m;i++) for(let j=0;j<n;j++){
    let rem = x[i] ? (x[i][j]||0) : 0;
    if(!(rem > EPS)) continue;
    const paths = (model.allPaths && model.allPaths[i] && model.allPaths[i][j]) || [];
    for(let k=0; k<paths.length && rem > EPS; k++){
      const pt = paths[k];
      const lim = (pt.cap!=null && k < paths.length - 1) ? pt.cap : Infinity;
      const send = Math.min(rem, lim);
      if(send > EPS){
        for(const edge of pt.edges){
          flows[edge.id] = (flows[edge.id]||0) + send;
        }
        rem -= send;
      }
    }
  }
  return flows;
}

/* Formulación matemática del problema (para exponer). */
function formulation(model, prob){
  const { plants, dests } = model;
  const m = prob.m, n = prob.n;
  const nm = (i,j)=> 'x'+sub(i+1)+sub(j+1);
  let Z = [];
  for(let i=0;i<m;i++) for(let j=0;j<n;j++){
    if(prob.cost[i][j]===null) continue;
    Z.push(fmtN(prob.cost[i][j])+'·'+nm(i,j));
  }
  let txt = 'Min  Z = ' + (Z.length? Z.join(' + ') : '0');
  txt += '\n\nSujeto a:';
  for(let i=0;i<m;i++){
    const cells = [];
    for(let j=0;j<n;j++) if(prob.cost[i][j]!==null) cells.push(nm(i,j));
    if(!cells.length) continue;
    const label = i===prob.dummyRow ? ' (planta ficticia)' : ' (oferta '+plants[i].name+')';
    txt += '\n  ' + cells.join(' + ') + ' = ' + fmtN(prob.supply[i]) + label;
  }
  for(let j=0;j<n;j++){
    const cells = [];
    for(let i=0;i<m;i++) if(prob.cost[i][j]!==null) cells.push(nm(i,j));
    if(!cells.length) continue;
    const label = j===prob.dummyCol ? ' (destino ficticio)' : ' (demanda '+dests[j].name+')';
    txt += '\n  ' + cells.join(' + ') + ' = ' + fmtN(prob.demand[j]) + label;
  }
  const blocked = [];
  for(let i=0;i<m;i++) for(let j=0;j<n;j++) if(prob.cost[i][j]===null && i<prob.m0 && j<prob.n0) blocked.push(nm(i,j));
  if(blocked.length) txt += '\n  ' + blocked.join(', ') + ' no disponibles (sin ruta)';
  txt += '\n  x'+'ᵢⱼ ≥ 0  para todo i, j';
  return txt;
}

/* ---------- helpers de formato ---------- */
const SUBS = ['₀','₁','₂','₃','₄','₅','₆','₇','₈','₉'];
function sub(k){ return String(k).split('').map(c=>SUBS[+c] ?? c).join(''); }
function fmtN(v){
  if(v==null || !isFinite(v)) return '∞';
  const r = Math.round(v*1000)/1000;
  return Number.isInteger(r) ? String(r) : String(r);
}

/* ---------- utilidades de red ---------- */
const nodeById = id => state.nodes.find(n=>n.id===id);
const edgesOf = id => state.edges.filter(e=>e.from===id || e.to===id);
function autoName(type){
  const pre = type==='plant'?'P':type==='dest'?'D':'H';
  let k=0;
  do{ k++; } while(state.nodes.some(n=>n.name === pre+k));
  return pre+k;
}
function findFreePos(type){
  const baseX = type==='plant' ? 140 : type==='dest' ? 660 : 400;
  const startY = type==='plant' ? 120 : type==='dest' ? 100 : 180;
  const stepY = 115;
  let idx = 0;
  while(idx < 50){
    const candY = startY + idx * stepY;
    const clash = state.nodes.some(n => Math.abs(n.x - baseX) < NW_ * 0.8 && Math.abs(n.y - candY) < NH_ * 1.15);
    if(!clash) return { x: baseX, y: candY };
    idx++;
  }
  return { x: baseX + (Math.random()*40-20), y: startY + idx*stepY };
}
function addNode(type){
  const pos = findFreePos(type);
  const n = {
    id:'n'+(state.nextId++),
    type,
    name:autoName(type),
    supply:type==='plant'?50:0,
    demand:type==='dest'?50:0,
    x:pos.x,
    y:pos.y
  };
  state.nodes.push(n);
  // No se auto-conectan las rutas: el usuario decide qué conectar con la herramienta Ruta o desde la matriz
  ui.sel = { type:'node', id:n.id };

        `Hub ${n.name} agregado: conecta Planta→${n.name} y ${n.name}→Destino`, 'ok', 3400);
}

function connectNodeHelper(nodeId){

/* Determina la dirección válida entre dos nodos (incluso si el usuario los tocó al revés). */
function resolvePair(a, b){
  if(!a || !b || a.id===b.id) return null;
  if(a.type==='plant' && (b.type==='dest' || b.type==='hub')) return { from:a, to:b };
  if(b.type==='plant' && (a.type==='dest' || a.type==='hub')) return { from:b, to:a };
  if(a.type==='hub' && b.type==='dest') return { from:a, to:b };
  if(b.type==='hub' && a.type==='dest') return { from:b, to:a };
  if(a.type==='hub' && b.type==='hub') return { from:a, to:b };
  return null;
}
function tryConnect(fromId, toId){
  const a = nodeById(fromId), b = nodeById(toId);
  const pair = resolvePair(a, b);
  if(!pair){
    toast('Conexión no válida: conecta Planta↔Destino, Planta↔Hub o Hub↔Destino.', 'error');
    return;
  }
  const existing = state.edges.find(e=>e.from===pair.from.id && e.to===pair.to.id);
  if(existing){
    ui.sel = { type:'edge', id:existing.id };
    renderGraph();
    renderSide();
    if(mqMobile.matches) openSheet('datos');
    const costInp = $('#fCost');
    if(costInp){ costInp.focus(); costInp.select(); }
    toast(`Ruta ${pair.from.name}→${pair.to.name} seleccionada para editar.`, 'ok');
    return;
  }
  const isHubLeg = pair.from.type==='hub' || pair.to.type==='hub';
  const defCost = isHubLeg ? 2 : 5;
  const newEdge = { id:'n'+(state.nextId++), from:pair.from.id, to:pair.to.id, cost:defCost, capacity:null };
  state.edges.push(newEdge);
  ui.sel = { type:'edge', id:newEdge.id };
  hideHint();
  mutate({ refreshSide:true });
  if(mqMobile.matches) openSheet('datos');
  toast(`Ruta ${pair.from.name} → ${pair.to.name} creada (costo ${defCost}).`, 'ok');
}

function recalcLive(animateNumbers){
  if(!ui.liveSolve) return;
  const plants = state.nodes.filter(n=>n.type==='plant');
  const dests  = state.nodes.filter(n=>n.type==='dest');
  if(!plants.length || !dests.length){
    ui.results = { error:'Agrega al menos una planta y un destino para calcular la solución.', notes:[], warnings:[] };
    ui.flows = null;
    renderResults(false);
    renderGraph();
    updatePeek();
    return;
  }
  if(plants.every(p=>p.supply<=0) || dests.every(d=>d.demand<=0)){
    ui.results = { error:'La oferta y la demanda deben ser mayores que 0.', notes:[], warnings:[] };
    ui.flows = null;
    renderResults(false);
    renderGraph();
    updatePeek();
    return;
  }
  try{
    const model = buildModel(state);
    const res = solveFull(model);
    ui.model = model;
    ui.results = res;
    if(res.error){
      ui.flows = null;
      const shorts = (res.shortIdx||[]).map(i=>model.dests[i] && model.dests[i].name).filter(Boolean);
      res.displayError = res.error + (shorts.length ? ' (sin cubrir: ' + shorts.join(', ') + ')' : '');
    } else {
      if(ui.tab==='nw' && !res.nw.x) ui.tab = 'best';
      if(ui.tab==='lc' && !res.lc.x) ui.tab = 'best';
      const x = ui.tab==='nw' && res.nw.x ? res.nw.x : ui.tab==='lc' && res.lc.x ? res.lc.x : res.best.x;
      ui.flows = edgeFlows(state, model, x);
    }
    renderResults(!!animateNumbers);
    renderGraph();
    updatePeek();
  }catch(err){
    console.error(err);
  }
}

function updateSideTotalsInPlace(){

/* ---------- geometría de aristas ---------- */
function clipRect(from, to){
  const dx = to.x-from.x, dy = to.y-from.y;
  let t = 1;
  if(Math.abs(dx) > 1e-6) t = Math.min(t, (NW_/2+3)/Math.abs(dx));
  if(Math.abs(dy) > 1e-6) t = Math.min(t, (NH_/2+3)/Math.abs(dy));
  return { x: from.x + dx*t, y: from.y + dy*t };
}
function edgeGeom(e){
  const a = nodeById(e.from), b = nodeById(e.to);
  if(!a || !b) return null;
  const p1 = clipRect(a, b), p2 = clipRect(b, a);
  return { p1, p2, mid:{ x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2 } };
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nodeHtml(n){

function nodeStats(n){
  let inp = 0, out = 0;
  state.edges.forEach(e=>{
    const f = ui.flows[e.id] || 0;

    if(e.to===n.id) inp += f;
  });

}

          const e = findEdge(p.id, h.id);
          if(!e) return `<td class="blocked"><button data-from="${p.id}" data-to="${h.id}" data-defcost="2" title="Conectar ${esc(p.name)} → ${esc(h.name)}">+</button></td>`;
          return `<td><div class="cell-box">
            <input class="edge-cost" data-edge="${e.id}" type="number" min="0" step="any" value="${e.cost}" title="Costo ${esc(p.name)} → ${esc(h.name)}">
            <button class="x" data-del-edge="${e.id}" title="Quitar tramo ${esc(p.name)} → ${esc(h.name)}">×</button>
          </div></td>`;
        }).join('')}
      </tr>`).join('');
    phHtml = `<div class="hub-sub">Entrada al Hub (Planta → Hub)</div>
      <div class="matrix-wrap"><table class="matrix"><thead><tr><th class="rh">Planta</th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // Tabla 2: Hub -> Destino
  let hdHtml = '';
  if(dests.length){
    const heads = dests.map(d=>`<th>${esc(d.name)}</th>`).join('');
    const rows = hubs.map(h=>`
      <tr>
        <td class="row-label">${esc(h.name)}</td>
        ${dests.map(d=>{
          const e = findEdge(h.id, d.id);
          if(!e) return `<td class="blocked"><button data-from="${h.id}" data-to="${d.id}" data-defcost="2" title="Conectar ${esc(h.name)} → ${esc(d.name)}">+</button></td>`;
          return `<td><div class="cell-box">
            <input class="edge-cost" data-edge="${e.id}" type="number" min="0" step="any" value="${e.cost}" title="Costo ${esc(h.name)} → ${esc(d.name)}">
            <button class="x" data-del-edge="${e.id}" title="Quitar tramo ${esc(h.name)} → ${esc(d.name)}">×</button>
          </div></td>`;
        }).join('')}
      </tr>`).join('');
    hdHtml = `<div class="hub-sub">Salida del Hub (Hub → Destino)</div>
      <div class="matrix-wrap"><table class="matrix"><thead><tr><th class="rh">Hub</th>${heads}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  return `<div class="hub-section">
    <h4><span>Tramos de Hub (Transbordo)</span><span class="badge hub">${hubs.length} HUB${hubs.length>1?'S':''}</span></h4>
    ${phHtml}
    ${hdHtml}
  </div>`;
}

function renderSide(){
  const side = $('#side');
  const model = buildModel(state);
  const { plants, dests, hubs } = model;
  const inspector = buildInspectorHtml();

  let matrixContent = '';
  if(!plants.length && !dests.length && !hubs.length){
    matrixContent = `<div class="empty-state">
      <svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8 16l8-8"/></svg>
      <p>Todavía no hay nodos.<br>Agrega <b>plantas</b> y <b>destinos</b> con la barra izquierda, o carga un <b>Ejemplo</b> arriba.</p>
    </div>`;
  } else if(!plants.length || !dests.length){
    matrixContent = `
      ${buildHubSectionHtml(model)}
      <div class="empty-state">
        <svg viewBox="0 0 24 24"><path d="M3 21V10l5 3V10l5 3V7l6 4v10z"/><path d="M3 21h18"/></svg>
        <p>${plants.length ? 'Agrega al menos un <b>Destino</b> para completar la tabla.' : 'Agrega al menos una <b>Planta</b> para completar la tabla.'}</p>
      </div>`;
  } else {
    const heads = dests.map(d=>`<th title="Clic para seleccionar ${esc(d.name)}" style="cursor:pointer" data-sel-node="${d.id}">${esc(d.name)}</th>`).join('');
    const rows = plants.map((p, idxP)=>`
      <tr>
        <td class="row-label" style="cursor:pointer" data-sel-node="${p.id}" title="Clic para seleccionar ${esc(p.name)}">${esc(p.name)}<small>oferta</small></td>
        ${dests.map((d, idxD)=>{
          const de = model.directEdge[idxP][idxD];
          const vBest = model.viaBest[idxP][idxD];
          if(!de){
            return `<td class="blocked">
              <button data-from="${p.id}" data-to="${d.id}" data-defcost="5" title="Sin ruta directa ${esc(p.name)}→${esc(d.name)}: clic para crearla">+</button>
              <span class="via-hint" data-via-cell="${p.id}_${d.id}" style="${vBest?'':'display:none'}">${vBest ? `vía ${esc(vBest.viaLabel)}: ${fmtN(vBest.cost)}` : ''}</span>
            </td>`;
          }
          return `<td><div class="cell-box">
            <input class="edge-cost" data-edge="${de.id}" type="number" min="0" step="any" value="${de.cost}" title="Costo directo ${esc(p.name)} → ${esc(d.name)}">
            <button class="x" data-del-edge="${de.id}" title="Quitar ruta directa ${esc(p.name)} → ${esc(d.name)}">×</button>
            <span class="via-tag" data-via-cell="${p.id}_${d.id}" style="${vBest?'':'display:none'}" title="Ruta alternativa vía Hub">${vBest ? `vía ${esc(vBest.viaLabel)}: ${fmtN(vBest.cost)}` : ''}</span>
          </div></td>`;
        }).join('')}
        <td><input class="fixed" data-node="${p.id}" data-attr="supply" type="number" min="0" step="any" value="${p.supply}" title="Oferta de ${esc(p.name)}"></td>
      </tr>`).join('');
    const totS = sum(plants.map(p=>p.supply));
    const totD = sum(dests.map(d=>d.demand));
    const bal = Math.abs(totS-totD) < 1e-9;

    matrixContent = `
      <div class="matrix-toolbar">
        <span class="mt-title">Rutas directas y oferta/demanda</span>
        <div class="mt-btns">
          <button class="mini-btn" id="btnConnectMissing" title="Crear todas las rutas directas faltantes (costo 5)">+ Conectar todo</button>
          <button class="mini-btn danger" id="btnClearEdges" title="Quitar todas las rutas conservando los nodos">Quitar rutas</button>
        </div>
      </div>
      <div class="matrix-wrap">
        <table class="matrix">
          <thead><tr><th class="rh"></th>${heads}<th>Oferta</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot>
            <tr><th class="rh">Demanda</th>${dests.map(d=>`<td><input class="fixed" data-node="${d.id}" data-attr="demand" type="number" min="0" step="any" value="${d.demand}" title="Demanda de ${esc(d.name)}"></td>`).join('')}<td class="tot" id="totSupplyCell">${fmtN(totS)}</td></tr>
            <tr><td colspan="${dests.length+2}" style="text-align:left;padding-top:6px"><span id="balNote" class="tot ${bal?'bal-ok':'bal-bad'}">${fmtN(totS)} ${bal?'=':'≠'} ${fmtN(totD)}  ${bal?'✓ problema balanceado':'⚠ se agregará un nodo ficticio'}</span></td></tr>
          </tfoot>
        </table>
      </div>
      ${buildHubSectionHtml(model)}
      <div class="mtx-legend">
        <span><i style="background:${COLORS.plant}"></i>Planta</span>
        <span><i style="background:${COLORS.dest}"></i>Destino</span>
        ${hubs.length ? `<span><i style="background:${COLORS.hub}"></i>Hub</span>` : ''}
        <span><i style="background:#f8fafc;border:1px dashed #cbd5e1"></i><b>+</b> Conectar ruta</span>
      </div>
      <div class="muted-note" style="margin-top:10px">Puedes editar cualquier costo, oferta, demanda o ruta en todo momento. Si ya ejecutaste <b>Resolver</b>, el resultado se actualiza en vivo.</div>`;
  }

  side.innerHTML = `
    <div class="side-head">
      <h2>Datos del problema</h2>
      ${ui.liveSolve ? `<span class="badge plant">EN VIVO</span>` : ''}
    </div>
    <div class="side-body">
      ${inspector}
      ${matrixContent}
    </div>`;

  // Eventos del Inspector
  const closeInsp = $('#closeInspector');
  if(closeInsp) closeInsp.addEventListener('click', ()=>{ ui.sel = null; renderGraph(); renderSide(); });

  const nameI = $('#fName');
  if(nameI && ui.sel && ui.sel.type==='node'){
    const n = nodeById(ui.sel.id);
    nameI.addEventListener('input', ()=>{
      if(!n) return;
      n.name = nameI.value.trim() || n.name;
      save();
      if(ui.liveSolve) recalcLive(false); else renderGraph();
    });
    nameI.addEventListener('change', ()=>renderSide());
  }
  const supI = $('#fSupply');
  if(supI && ui.sel && ui.sel.type==='node'){
    const n = nodeById(ui.sel.id);
    const onSup = ()=>{
      const v = parseFloat(supI.value);
      if(n && isFinite(v) && v>=0){
        n.supply = v;
        const mInp = side.querySelector(`input[data-node="${n.id}"][data-attr="supply"]`);
        if(mInp && mInp !== document.activeElement) mInp.value = v;
        hideHint();
        mutate({ refreshSide:false });
      }
    };
    supI.addEventListener('input', onSup);
    supI.addEventListener('change', ()=>{ if(n) supI.value = n.supply; });
  }
  const demI = $('#fDemand');
  if(demI && ui.sel && ui.sel.type==='node'){
    const n = nodeById(ui.sel.id);
    const onDem = ()=>{
      const v = parseFloat(demI.value);
      if(n && isFinite(v) && v>=0){
        n.demand = v;
        const mInp = side.querySelector(`input[data-node="${n.id}"][data-attr="demand"]`);
        if(mInp && mInp !== document.activeElement) mInp.value = v;
        hideHint();
        mutate({ refreshSide:false });
      }
    };
    demI.addEventListener('input', onDem);
    demI.addEventListener('change', ()=>{ if(n) demI.value = n.demand; });
  }
  const connNodeBtn = $('#fConnectNode');
  if(connNodeBtn && ui.sel && ui.sel.type==='node'){
    connNodeBtn.addEventListener('click', ()=>connectNodeHelper(ui.sel.id));
  }
  const delNodeBtn = $('#fDelete');
  if(delNodeBtn && ui.sel && ui.sel.type==='node'){
    delNodeBtn.addEventListener('click', ()=>{ deleteNode(ui.sel.id); toast('Nodo eliminado','ok'); });
  }

  const costI = $('#fCost');
  if(costI && ui.sel && ui.sel.type==='edge'){
    const e = state.edges.find(x=>x.id===ui.sel.id);
    const onCost = ()=>{
      const v = parseFloat(costI.value);
      if(e && isFinite(v) && v>=0){
        e.cost = v;
        const mInp = side.querySelector(`input.edge-cost[data-edge="${e.id}"]`);
        if(mInp && mInp !== document.activeElement) mInp.value = v;
        hideHint();
        mutate({ refreshSide:false });
      }
    };
    costI.addEventListener('input', onCost);
    costI.addEventListener('change', ()=>{ if(e) costI.value = e.cost; });
  }
  const capI = $('#fCap');
  if(capI && ui.sel && ui.sel.type==='edge'){
    const e = state.edges.find(x=>x.id===ui.sel.id);
    const onCap = ()=>{
      if(!e) return;
      if(capI.value.trim()===''){ e.capacity = null; hideHint(); mutate({ refreshSide:false }); return; }
      const v = parseFloat(capI.value);
      if(isFinite(v) && v>=0){ e.capacity = v; hideHint(); mutate({ refreshSide:false }); }
    };
    capI.addEventListener('input', onCap);
    capI.addEventListener('change', ()=>{ if(e) capI.value = e.capacity!=null ? e.capacity : ''; });
  }
  const delEdgeBtn = $('#fDelEdge');
  if(delEdgeBtn && ui.sel && ui.sel.type==='edge'){
    delEdgeBtn.addEventListener('click', ()=>{ deleteEdge(ui.sel.id); toast('Ruta eliminada','ok'); });
  }

  // Eventos de la Matriz y Tramos de Hub
  const btnConnAll = $('#btnConnectMissing');
  if(btnConnAll) btnConnAll.addEventListener('click', connectAllMissing);
  const btnClrEdges = $('#btnClearEdges');
  if(btnClrEdges) btnClrEdges.addEventListener('click', clearOnlyEdges);

  side.querySelectorAll('[data-sel-node]').forEach(el=>{
    el.addEventListener('click', ()=>{
      ui.sel = { type:'node', id:el.dataset.selNode };
      renderGraph();
      renderSide();
    });
  });

  side.querySelectorAll('input.edge-cost').forEach(inp=>{
    const onEdgeCost = ()=>{
      const v = parseFloat(inp.value);
      const e = state.edges.find(x=>x.id===inp.dataset.edge);
      if(e && isFinite(v) && v>=0){
        e.cost = v;
        if(costI && ui.sel && ui.sel.type==='edge' && ui.sel.id===e.id && costI !== document.activeElement) costI.value = v;
        hideHint();
        mutate({ refreshSide:false });
      }
    };
    inp.addEventListener('input', onEdgeCost);
    inp.addEventListener('change', ()=>{
      const e = state.edges.find(x=>x.id===inp.dataset.edge);
      if(e) inp.value = e.cost;
    });
  });

  side.querySelectorAll('button[data-del-edge]').forEach(btn=>{
    btn.addEventListener('click', ev=>{
      ev.stopPropagation();
      deleteEdge(btn.dataset.delEdge);
      toast('Ruta eliminada', 'ok', 1800);
    });
  });

  side.querySelectorAll('td.blocked button[data-from]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const defC = parseFloat(btn.dataset.defcost) || 5;
      const ne = { id:'n'+(state.nextId++), from:btn.dataset.from, to:btn.dataset.to, cost:defC, capacity:null };
      state.edges.push(ne);
      hideHint();
      mutate({ refreshSide:true });
      const newInp = side.querySelector(`input.edge-cost[data-edge="${ne.id}"]`);
      if(newInp){ newInp.focus(); newInp.select(); }
    });
  });

  side.querySelectorAll('input[data-node]').forEach(inp=>{
    const onNodeVal = ()=>{
      const n = nodeById(inp.dataset.node);
      const v = parseFloat(inp.value);
      if(n && isFinite(v) && v>=0){
        if(inp.dataset.attr==='supply'){
          n.supply = v;
          if(supI && ui.sel && ui.sel.type==='node' && ui.sel.id===n.id && supI !== document.activeElement) supI.value = v;
        } else {
          n.demand = v;
          if(demI && ui.sel && ui.sel.type==='node' && ui.sel.id===n.id && demI !== document.activeElement) demI.value = v;
        }
        hideHint();
        mutate({ refreshSide:false });
      }
    };
    inp.addEventListener('input', onNodeVal);
    inp.addEventListener('change', ()=>{
      const n = nodeById(inp.dataset.node);
      if(n) inp.value = inp.dataset.attr==='supply' ? n.supply : n.demand;
    });
  });
}

/* ---------- ejecución ---------- */
function run(){
  const plants = state.nodes.filter(n=>n.type==='plant');
  const dests  = state.nodes.filter(n=>n.type==='dest');
  if(!plants.length || !dests.length){ toast('Agrega al menos una planta y un destino antes de resolver.','error',3600); return; }
  if(plants.every(p=>p.supply<=0) || dests.every(d=>d.demand<=0)){ toast('La oferta y la demanda deben ser mayores que 0.','error'); return; }
  ui.liveSolve = true;
  $('#btnRunLabel').textContent = 'Recalcular';
  $('#results').classList.remove('minimized');
  updateMinBtnLabel();
  recalcLive(true);
  openResults();
  renderSide();
  if(ui.results && !ui.results.error){
    toast('Costo mínimo encontrado: ' + fmtN(ui.results.best.z) + ' · Puedes seguir editando en vivo','ok',3400);
  } else if(ui.results && ui.results.error){
    toast('Revisa las rutas: ' + ui.results.error, 'error', 4000);
  }
  hideHint();
}
function applyTab(){
  const R = ui.results;
  if(!R || R.error){ ui.flows = null; renderGraph(); return; }
  const x = ui.tab==='nw' && R.nw.x ? R.nw.x : ui.tab==='lc' && R.lc.x ? R.lc.x : R.best.x;
  ui.flows = edgeFlows(state, ui.model, x);
  renderGraph();
}
function openResults(){
  if(mqMobile.matches) openSheet('resultados');
  else $('#results').classList.add('open');
}
function updateMinBtnLabel(){
  const btn = $('#resultsToggleMin');
  if(!btn) return;
  const isMin = $('#results').classList.contains('minimized');
  btn.textContent = isMin ? '▲ Expandir' : '▼ Minimizar';
}

/* ---------- resultados ---------- */
function countUp(el, target){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ el.textContent = fmtN(target); return; }
  const t0 = performance.now(), dur = 500;
  let done = false;
  function finish(){ if(done) return; done = true; el.textContent = fmtN(target); }
  function frame(){
    if(done) return;
    const p = Math.min(1, Math.max(0, (performance.now()-t0)/dur));
    const e = 1 - Math.pow(1-p, 3);
    el.textContent = p<1 ? fmtN(Math.round(target*e)) : fmtN(target);
    if(p<1) requestAnimationFrame(frame); else done = true;
  }
  requestAnimationFrame(frame);
  setTimeout(finish, dur+90);
}
function noticeHtml(text, kind){
  return `<div class="notice${kind==='err'?' err':''}"><svg viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><div>${esc(text)}</div></div>`;
}
function allocTable(R, x){
  const M = R.model, P = R.prob;
  const nR = P.m, nC = P.n;
  const head = `<tr><th></th>${Array.from({length:nC},(_,j)=>{
      const name = j < M.dests.length ? M.dests[j].name : 'Ficticio';
      const dum = j >= M.dests.length ? ' class="dummy"' : '';
      return `<th${dum}>${esc(name)}</th>`;
    }).join('')}<th>Oferta</th></tr>`;
  const body = Array.from({length:nR},(_,i)=>{
    const name = i < M.plants.length ? M.plants[i].name : 'Ficticia';
    const dum = i >= M.plants.length ? ' class="dummy"' : '';
    const cells = Array.from({length:nC},(_,j)=>{
      const v = x[i] ? (x[i][j]||0) : 0;
      const pos = v > 1e-9;
      const dj = j >= M.dests.length ? ' dummy' : '';
      const viaLbl = (pos && i < M.plants.length && j < M.dests.length && M.viaName && M.viaName[i][j]) ? ` <small style="color:#b45309">(vía ${esc(M.viaName[i][j])})</small>` : '';
      return `<td class="v${pos?' pos':''}${dj}">${pos ? fmtN(v) + viaLbl : '·'}</td>`;
    }).join('');
    const rt = Array.from({length:nC},(_,j)=> (x[i]?(x[i][j]||0):0)).reduce((s,v)=>s+v,0);
    return `<tr><td class="name${dum}">${esc(name)}</td>${cells}<td class="v"><b>${fmtN(rt)}</b></td></tr>`;
  }).join('');
  const foot = `<tr class="sum"><td class="name">Demanda</td>${Array.from({length:nC},(_,j)=>{
      const ct = Array.from({length:nR},(_,i)=> (x[i]?(x[i][j]||0):0)).reduce((s,v)=>s+v,0);
      return `<td class="v">${fmtN(ct)}</td>`;
    }).join('')}<td class="v">${fmtN(sum(x.flat()))}</td></tr>`;
  return `<table class="alloc"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
}
function logHtml(R){
  let h = '';
  const head = t => `<div class="lg-head">${esc(t)}</div>`;
  if(R.nw.x){
    h += head('■ Esquina noroeste — solución inicial');
    h += R.nw.steps.map(s=>esc(s)).join('<br>');
    h += '<br><b>Costo total: ' + fmtN(R.nw.z) + '</b>';
  } else h += '<div class="lg-warn">■ Esquina noroeste: ' + esc(R.nw.error) + '</div>';
  h += '<br>';
  if(R.lc.x){
    h += head('■ Costo mínimo — solución inicial');
    h += R.lc.steps.map(s=>esc(s)).join('<br>');
    h += '<br><b>Costo total: ' + fmtN(R.lc.z) + '</b>';
  } else h += '<div class="lg-warn">■ Costo mínimo: ' + esc(R.lc.error) + '</div>';
  h += '<br>';
  if(R.modi){
    h += head('■ MODI (u-v) — mejoramiento desde ' + R.modiFrom);
    if(R.modi.steps.length) h += R.modi.steps.map(s=>esc(s)).join('<br>') + '<br>';
    h += R.modi.optimal
      ? '<div class="lg-good">✓ Verificado con costos reducidos: ' + fmtN(R.modi.cost) + ' es la solución óptima.</div>'
      : '<div class="lg-warn">⚠ ' + esc(R.modi.note || 'Sin óptimo verificado.') + '</div>';
  }
  if(R.modiFromLC){
    h += '<br>' + head('■ MODI desde costo mínimo');
    h += R.modiFromLC.iters === 0
      ? '<div class="lg-good">✓ 0 iteraciones: la solución de costo mínimo ya era óptima.</div>'
      : R.modiFromLC.steps.map(s=>esc(s)).join('<br>') + '<br>' +
        (R.modiFromLC.optimal ? '<div class="lg-good">✓ Óptimo confirmado: ' + fmtN(R.modiFromLC.cost) + '</div>' : '<div class="lg-warn">⚠ ' + esc(R.modiFromLC.note||'') + '</div>');
  }
  return `<div class="log">${h}</div>`;
}
function hubCard(){
  if(!ui.flows || !ui.model || !ui.model.hubs.length) return '';
  return ui.model.hubs.map(h=>{
    let inp = 0, out = 0;
    state.edges.forEach(e=>{
      const f = ui.flows[e.id] || 0;
      if(e.to===h.id) inp += f;
      if(e.from===h.id) out += f;
    });
    const ok = Math.abs(inp-out) < 1e-6;
    return `<p>• <b>${esc(h.name)}</b>: entra ${fmtN(inp)} · sale ${fmtN(out)} — ${ok?'<span class="ok">✓ balanceado</span>':'<b>⚠ desbalance</b>'}</p>`;
  }).join('');
}
function renderResults(animateNumbers){
  const R = ui.results, box = $('#resultsInner'), barSum = $('#resultsBarSum');
  if(!R){
    box.innerHTML = '';
    if(barSum) barSum.textContent = '';
    return;
  }
  const notes = [...(R.notes||[]), ...(R.warnings||[])];
  if(R.error){
    if(barSum) barSum.textContent = '⚠ Red incompleta o sin solución factible';
    box.innerHTML = `
      ${noticeHtml(R.displayError || R.error, 'err')}
      ${notes.map(n=>noticeHtml(n)).join('')}
      ${R.prob && R.model ? `<details class="more"><summary>Modelo matemático</summary><div class="more-body"><div class="formula">${esc(formulation(R.model, R.prob))}</div></div></details>` : ''}`;
    return;
  }
  const nwZ = R.nw.x ? R.nw.z : null;
  const lcZ = R.lc.x ? R.lc.z : null;
  const bestZ = R.best.z;
  if(barSum) barSum.textContent = `Costo óptimo Z = ${fmtN(bestZ)}${nwZ!=null ? ` · Noroeste: ${fmtN(nwZ)}` : ''}${lcZ!=null ? ` · Costo mín.: ${fmtN(lcZ)}` : ''}`;
  const saveVs = nwZ!=null ? nwZ : lcZ;
  const saveAbs = saveVs!=null ? saveVs - bestZ : null;
  const savePct = saveVs ? Math.round(saveAbs/saveVs*100) : 0;
  const methods = [
    { id:'nw', name:'Esquina noroeste', z:nwZ },
    { id:'lc', name:'Costo mínimo', z:lcZ },

/* ---------- vista (zoom / pan) ---------- */
function applyView(){
  const v = ui.view;
  $('#world').setAttribute('transform', `translate(${v.x},${v.y}) scale(${v.k})`);
  const area = $('#canvasArea');
  area.style.backgroundSize = (24*v.k)+'px '+(24*v.k)+'px';
  area.style.backgroundPosition = v.x+'px '+v.y+'px';
}
function screenToWorld(cx, cy){
  const r = $('#canvasArea').getBoundingClientRect();
  return { x:(cx - r.left - ui.view.x)/ui.view.k, y:(cy - r.top - ui.view.y)/ui.view.k };
}
function zoomAt(cx, cy, factor){
  const v = ui.view;
  const r = $('#canvasArea').getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const nk = Math.min(2.4, Math.max(0.35, v.k*factor));
  v.x = px - (px - v.x)*(nk/v.k);
  v.y = py - (py - v.y)*(nk/v.k);
  v.k = nk;
  applyView();
}
function zoomFit(){
  const r = $('#canvasArea').getBoundingClientRect();
  if(!state.nodes.length){ ui.view = { x:0, y:0, k:1 }; applyView(); return; }
  const xs = state.nodes.map(n=>n.x), ys = state.nodes.map(n=>n.y);
  const minX = Math.min(...xs)-NW_, maxX = Math.max(...xs)+NW_;
  const minY = Math.min(...ys)-NH_, maxY = Math.max(...ys)+NH_;
  const bw = maxX-minX, bh = maxY-minY;
  // Descuenta la altura del panel de resultados si está abierto en escritorio
  let resH = 0;
  const resEl = $('#results');
  if(!mqMobile.matches && resEl && resEl.classList.contains('open')){
    resH = resEl.classList.contains('minimized') ? 42 : 280;
  }
  const availH = Math.max(180, r.height - resH);
  const k = Math.min((r.width-60)/bw, (availH-50)/bh, 1.45);
  ui.view = { k, x:(r.width - bw*k)/2 - minX*k, y:(availH - bh*k)/2 - minY*k };
  applyView();
}

/* ---------- interacción del lienzo (mouse + touch + pinza + arrastrar para conectar) ---------- */
let drag = null, pan = null, pinch = null, connectDrag = null;
const pointers = new Map();
function clearDragPan(){
  if(drag){ drag.el.classList.remove('dragging'); drag = null; }
  if(pan){ pan = null; }
  if(connectDrag){ connectDrag = null; updatePreviewLine(null); }
  $('#canvasArea').classList.remove('panning');
}
function pinchGeom(){
  const pts = [...pointers.values()];
  const dx = pts[0].x - pts[1].x, dy = pts[0].y - pts[1].y;
  return { d: Math.hypot(dx, dy) || 1, mx:(pts[0].x+pts[1].x)/2, my:(pts[0].y+pts[1].y)/2 };
}
$('#canvasArea').addEventListener('pointerdown', e=>{
  if(e.button !== 0) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(pointers.size >= 2){
    clearDragPan();
    const g = pinchGeom();
    pinch = { d:g.d, mx:g.mx, my:g.my };
    return;
  }
  const nodeEl = e.target.closest('.node');
  const edgeEl = e.target.closest('.edge');
  if(nodeEl){
    const id = nodeEl.dataset.id;
    if(ui.tool==='delete'){
      deleteNode(id);
      toast('Nodo eliminado','ok');
      return;
    }
    if(ui.tool==='connect'){
      // Soporta tanto clic-en-origen + clic-en-destino como arrastrar de origen a destino
      if(!ui.connectFrom){
        ui.connectFrom = id;
        connectDrag = { fromId: id, sx: e.clientX, sy: e.clientY, dragged: false };
        renderGraph();
      } else if(ui.connectFrom===id){
        ui.connectFrom = null;
        updatePreviewLine(null);
        renderGraph();
      } else {
        const from = ui.connectFrom;
        ui.connectFrom = null;
        updatePreviewLine(null);
        tryConnect(from, id);
      }
      return;
    }
    const n = nodeById(id);
    const w = screenToWorld(e.clientX, e.clientY);
    const changedSel = !ui.sel || ui.sel.type!=='node' || ui.sel.id!==id;
    ui.sel = { type:'node', id };
    if(changedSel){
      renderGraph();
      renderSide();
    }
    const currentNodeEl = $(`#nodesLayer g[data-id="${id}"]`) || nodeEl;
    drag = { id, ox:w.x - n.x, oy:w.y - n.y, moved:false, sx:e.clientX, sy:e.clientY, el:currentNodeEl };
    return;
  }
  if(edgeEl){
    const id = edgeEl.dataset.id;
    if(ui.tool==='delete'){ deleteEdge(id); toast('Ruta eliminada','ok'); return; }
    ui.connectFrom = null;
    updatePreviewLine(null);
    ui.sel = { type:'edge', id };
    renderGraph(); renderSide();
    if(mqMobile.matches) openSheet('datos');
    return;
  }
  // fondo: cancelar connectFrom o iniciar pan
  if(ui.connectFrom){
    ui.connectFrom = null;
    updatePreviewLine(null);
    renderGraph();
  }
  pan = { sx:e.clientX, sy:e.clientY, vx:ui.view.x, vy:ui.view.y, moved:false };
  $('#canvasArea').classList.add('panning');
});
window.addEventListener('pointermove', e=>{
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(pinch && pointers.size >= 2){
    const g = pinchGeom();
    zoomAt(g.mx, g.my, g.d / pinch.d);
    ui.view.x += g.mx - pinch.mx;
    ui.view.y += g.my - pinch.my;
    applyView();
    pinch = { d:g.d, mx:g.mx, my:g.my };
    return;
  }
  if(ui.tool==='connect' && ui.connectFrom){
    if(connectDrag && Math.abs(e.clientX - connectDrag.sx) + Math.abs(e.clientY - connectDrag.sy) > 8){
      connectDrag.dragged = true;
    }
    updatePreviewLine(screenToWorld(e.clientX, e.clientY));
    return;
  }
  if(drag){
    if(Math.abs(e.clientX-drag.sx) + Math.abs(e.clientY-drag.sy) > 4){
      drag.moved = true;
      drag.el.classList.add('dragging');
    }
    if(drag.moved){
      const n = nodeById(drag.id);
      if(n){
        const w = screenToWorld(e.clientX, e.clientY);
        n.x = Math.round(w.x - drag.ox);
        n.y = Math.round(w.y - drag.oy);
        updateNodePos(n);
        refreshEdgePaths();
      }
    }
    return;
  }
  if(pan){
    const dx = e.clientX-pan.sx, dy = e.clientY-pan.sy;
    if(Math.abs(dx)+Math.abs(dy) > 4) pan.moved = true;
    ui.view.x = pan.vx + dx;
    ui.view.y = pan.vy + dy;
    applyView();
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = null;
  $('#canvasArea').classList.remove('panning');
  if(connectDrag){
    const cd = connectDrag;
    connectDrag = null;
    if(cd.dragged){
      const elUnder = document.elementFromPoint(e.clientX, e.clientY);
      const targetNode = elUnder && elUnder.closest ? elUnder.closest('.node') : null;
      if(targetNode && targetNode.dataset.id && targetNode.dataset.id !== cd.fromId){
        ui.connectFrom = null;
        updatePreviewLine(null);
        tryConnect(cd.fromId, targetNode.dataset.id);
        return;
      }
    } else {
      toast('Ahora toca el nodo a conectar (o arrastra entre nodos).', 'ok', 2200);
    }
  }
  if(drag){
    const wasMoved = drag.moved;
    drag.el.classList.remove('dragging');
    drag = null;
    if(wasMoved){ save(); return; }
    if(mqMobile.matches) openSheet('datos');
    return;
  }
  if(pan){
    const moved = pan.moved;
    pan = null;
    if(!moved && ui.sel){
      ui.sel = null;
      renderGraph();
      renderSide();
    }
  }
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', e=>{
  pointers.delete(e.pointerId);
  if(pointers.size < 2) pinch = null;
  clearDragPan();
});

function openSheet(mode){
  if(mode==='resultados' && !ui.results){
    toast('Toca Resolver para ver los resultados.','warn',2600);
    mode = 'datos';
  }
  if(!mqMobile.matches){
    if(mode==='resultados') $('#results').classList.add('open');
