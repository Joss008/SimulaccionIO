  $$('.sheet-tab').forEach(t=>t.classList.toggle('active', t.dataset.sheet===mode));
  updatePeek();
}
function updatePeek(){
  const el = $('#sheetPeek');
  if(!el) return;
  const m = buildModel(state);
  const sup = sum(m.plants.map(p=>p.supply)), dem = sum(m.dests.map(d=>d.demand));
  const ok = Math.abs(sup-dem) < 1e-9;
  let txt;
  if(!m.plants.length && !m.dests.length) txt = 'Sin datos';
  else txt = fmtN(sup) + (ok ? ' = ' : ' ≠ ') + fmtN(dem) + (ok ? ' ✓' : ' ⚠');
  if(ui.results && ui.results.best) txt += ' · Z=' + fmtN(ui.results.best.z);
  el.textContent = txt;
}

/* arrastre del sheet por el handle (3 snaps: peek / medio / completo) */
let sheetDrag = null;
function sheetSnapHeights(){
  const vh = window.innerHeight;
  return [56, Math.round(vh*0.55), Math.round(vh*0.88)];
}
function endSheetDrag(cancelled){
  const sd = sheetDrag;
  sheetDrag = null;
  const sheet = $('#sheet');
  sheet.classList.remove('dragging');
  sheet.style.removeProperty('--sheet-h');
  if(!sd) return;
  if(!sd.moved){
    const cur = document.body.classList.contains('snap-full') ? 'full'
              : document.body.classList.contains('snap-peek') ? 'peek' : 'half';
    setSnap(cur==='half' ? 'peek' : 'half');
    return;
  }
  const names = ['peek','half','full'];
  const cands = sheetSnapHeights();
  let idx = 0, best = Infinity;
  cands.forEach((c,i)=>{ const d = Math.abs(c - sd.h); if(d < best){ best = d; idx = i; } });
  if(!cancelled && Math.abs(sd.v) > 700) idx = Math.min(2, Math.max(0, idx + (sd.v > 0 ? -1 : 1)));
  setSnap(names[idx]);
}
const grip = $('#sheetGrip');
grip.addEventListener('pointerdown', e=>{
  if(!mqMobile.matches || (e.button && e.button !== 0)) return;
  const sheet = $('#sheet');
  sheetDrag = { sy:e.clientY, h0:sheet.getBoundingClientRect().height, h:sheet.getBoundingClientRect().height,
                ly:e.clientY, lt:performance.now(), v:0, moved:false, id:e.pointerId };
  try{ grip.setPointerCapture(e.pointerId); }catch(_){}
  sheet.classList.add('dragging');
});
grip.addEventListener('pointermove', e=>{
  if(!sheetDrag || e.pointerId !== sheetDrag.id) return;
  const dy = e.clientY - sheetDrag.sy;
  if(Math.abs(dy) > 4) sheetDrag.moved = true;
  const now = performance.now();
  const dt = Math.max(1, now - sheetDrag.lt);
  sheetDrag.v = sheetDrag.v*0.65 + ((e.clientY - sheetDrag.ly)/dt*1000)*0.35;
  sheetDrag.ly = e.clientY; sheetDrag.lt = now;
  const cands = sheetSnapHeights();
  const h = Math.min(cands[2], Math.max(56, sheetDrag.h0 - dy));
  sheetDrag.h = h;
  $('#sheet').style.setProperty('--sheet-h', Math.round(h)+'px');
});
grip.addEventListener('pointerup', e=>{ if(sheetDrag && e.pointerId === sheetDrag.id) endSheetDrag(false); });
grip.addEventListener('pointercancel', e=>{ if(sheetDrag && e.pointerId === sheetDrag.id) endSheetDrag(true); });

$('#menuBackdrop').addEventListener('click', closeMenu);
$('#mExample').addEventListener('click', ()=>{ closeMenu(); loadExample(false); });
$('#mExampleHub').addEventListener('click', ()=>{ closeMenu(); loadExampleHub(false); });
$('#mClear').addEventListener('click', ()=>{ closeMenu(); clearAll(); });
$('#mFit').addEventListener('click', ()=>{ closeMenu(); zoomFit(); });
$$('#menuCard .menu-item[data-sheet]').forEach(b=>
  b.addEventListener('click', ()=>{ closeMenu(); openSheet(b.dataset.sheet); }));
$$('.sheet-tab').forEach(t=>t.addEventListener('click', ()=>openSheet(t.dataset.sheet)));
$('#sheetClose').addEventListener('click', closeSheet);

/* al volver a escritorio se limpia el estado del sheet/menú */
function onBpChange(ev){
  if(ev.matches) return;
  const was = document.body.classList.contains('sheet-open');
  const resMode = document.body.classList.contains('sheet-resultados');
  closeMenu(); closeSheet();
  document.body.classList.remove('sheet-datos','sheet-resultados');
  if(was && resMode && ui.results) $('#results').classList.add('open');
}
if(mqMobile.addEventListener) mqMobile.addEventListener('change', onBpChange);
else if(mqMobile.addListener) mqMobile.addListener(onBpChange);

/* ---------- botones superiores ---------- */
$('#btnRun').addEventListener('click', run);
$('#btnExample').addEventListener('click', ()=>loadExample(false));
$('#btnExampleHub').addEventListener('click', ()=>loadExampleHub(false));
$('#btnClear').addEventListener('click', clearAll);
$('#resultsToggleMin').addEventListener('click', ()=>{
  $('#results').classList.toggle('minimized');
  updateMinBtnLabel();
});
$('#resultsClose').addEventListener('click', ()=>{
  if(mqMobile.matches) closeSheet();
  else closeResultsView();
});
$$('.palette .tool[data-tool]').forEach(b=>b.addEventListener('click', ()=>{
  setTool(b.dataset.tool);
  if(b.dataset.tool==='connect') toast('Toca o arrastra entre nodos para crear una ruta (Planta→Destino, Planta→Hub, Hub→Destino).','ok',3400);
  if(b.dataset.tool==='delete') toast('Toca un nodo o ruta para borrarlo.','ok',2400);
}));
$('#addPlant').addEventListener('click', ()=>addNode('plant'));
$('#addDest').addEventListener('click', ()=>addNode('dest'));
$('#addHub').addEventListener('click', ()=>addNode('hub'));

/* ---------- arranque ---------- */
(function init(){
  const had = loadSaved();
  if(!had) { loadExample(true); }
  else { renderGraph(); renderSide(); zoomFit(); }
  applyView();
  updatePeek();
  if(mqMobile.matches) $('#hint').textContent = 'Arrastra los nodos con el dedo · usa «Ruta» para conectar · toca ☰ para el menú';
})();
// === APP END ===
</script>
</body>
</html>
